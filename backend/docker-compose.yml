services:
  db:
    image: postgres:16-alpine
    container_name: foodstore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodstore_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodstore_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: